name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its run in progress. Runs on main are never
# cancelled: they fill the cache every pull request starts from, and a cancelled run
# saves nothing, so two merges close together would leave main without one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integrity:
    name: Overlay hashes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/update_integrity.py --check

  smoke:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    defaults:
      run:
        # bash on every platform, Windows included, so the steps below are portable.
        shell: bash
        working-directory: e2e/smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          module-root: e2e/smoke
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ !github.event.pull_request.head.repo.fork }}

      # The Bazel disk cache set in e2e/smoke/.bazelrc. A clean DuckDB build takes close
      # to an hour on a hosted runner, so restore the most recent cache for this platform
      # even when the build files have changed.
      - name: Restore disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/duckdb-bazel-disk-cache
          # The architecture is in the key because restore-keys match by prefix:
          # "disk-cache-ubuntu-24.04-" also matches the ubuntu-24.04-arm caches, and the
          # x86_64 job was restoring those and compiling everything again.
          key: disk-cache-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('modules/**', 'e2e/**') }}
          restore-keys: disk-cache-${{ matrix.os }}-${{ runner.arch }}-

      - name: Mark start of build
        run: touch "$RUNNER_TEMP/build-start"

      - name: Test with every optional extension
        run: bazel test //... --keep_going

      - name: Test with no optional extensions, no jemalloc, static link
        run: >
          bazel test //... --keep_going
          --@duckdb//:autocomplete=false
          --@duckdb//:icu=false
          --@duckdb//:json=false
          --@duckdb//:parquet=false
          --@duckdb//:tpcds=false
          --@duckdb//:tpch=false
          --@duckdb//:jemalloc=false
          --dynamic_mode=off

      # Bazel refreshes the modification time of every cache entry it uses, so anything
      # older than the start of this build was not needed and would only grow the cache.
      # Skipped after a failure: a build that stopped early has not touched most of what
      # the next one needs.
      - name: Trim disk cache
        run: find ~/.cache/duckdb-bazel-disk-cache -type f ! -newer "$RUNNER_TEMP/build-start" -delete

      # Saved from pull requests too (GitHub scopes those caches to the pull request), so
      # that repeated pushes to one do not each pay for a full build. Not from forks:
      # their caches would count against the repository's quota and could evict main's.
      #
      # Saved after a failure too, so that a failed test or link does not throw away the
      # compilation before it. Those saves get a key of their own: cache keys cannot be
      # overwritten, and a partial cache under the normal key would block the complete
      # one from the run that fixes the failure.
      - name: Save disk cache
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/duckdb-bazel-disk-cache
          key: >-
            disk-cache-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('modules/**', 'e2e/**') }}${{
            job.status != 'success' && format('-failed-{0}-{1}', github.run_id, github.run_attempt) || '' }}

  # Upstream's own test suite, against an optimised build with every extension. A job of
  # its own because it needs an optimised build of DuckDB, separate from the smoke job's.
  unittest:
    name: DuckDB test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: e2e/smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          module-root: e2e/smoke
          bazelisk-cache: true
          repository-cache: true
          # The smoke job for this platform saves the same two caches.
          cache-save: false

      # A cache of its own: the optimised objects are different from the smoke job's.
      - name: Restore disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/duckdb-bazel-disk-cache
          key: disk-cache-unittest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('modules/**', 'e2e/**') }}
          restore-keys: disk-cache-unittest-${{ runner.os }}-${{ runner.arch }}-

      - name: Mark start of build
        run: touch "$RUNNER_TEMP/build-start"

      # On Windows the suite is built with clang-cl, the compiler upstream builds and
      # tests its Windows releases with. The smoke job covers MSVC.
      #
      # The clang-cl that ships with Visual Studio, not the separate LLVM on the runner:
      # MSVC's standard library refuses a Clang older than the one it was released with.
      - name: Find Visual Studio's clang-cl
        if: runner.os == 'Windows'
        run: |
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
          llvm="$vs\\VC\\Tools\\Llvm\\x64"
          "$(cygpath -u "$llvm")/bin/clang-cl.exe" --version
          echo "BAZEL_LLVM=$llvm" >> "$GITHUB_ENV"

      - name: Run DuckDB's test suite
        # A few of DuckDB's tests depend on timing and fail now and then on a loaded
        # runner; upstream's own harness retries failures too. A shard that passes on
        # its second attempt is reported as flaky, not as passed.
        run: >
          bazel test -c opt @duckdb//:unittest --keep_going --flaky_test_attempts=2
          ${{ runner.os == 'Windows' && '--config=clang-cl' || '' }}

      - name: Trim disk cache
        run: find ~/.cache/duckdb-bazel-disk-cache -type f ! -newer "$RUNNER_TEMP/build-start" -delete

      - name: Save disk cache
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/duckdb-bazel-disk-cache
          key: >-
            disk-cache-unittest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('modules/**', 'e2e/**') }}${{
            job.status != 'success' && format('-failed-{0}-{1}', github.run_id, github.run_attempt) || '' }}
